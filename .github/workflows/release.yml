name: Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies (Root)
      run: bun install

    - name: Install dependencies (CLI)
      run: |
        cd cli
        bun install

    - name: Install dependencies (Daemon)
      run: |
        cd daemon
        bun install

    - name: Install dependencies (Web)
      run: |
        cd web
        npm ci

    - name: Run tests
      run: bun run test

  release-version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # semantic-release necesita permiso de push incluso en --dry-run
      # (verifyConditions ejecuta `git push --dry-run`).
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: bun install

    - name: Resolve release version before building artifacts
      id: version
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=""
        if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/master" ]; then
          if ! bunx semantic-release --dry-run > semantic-release-dry-run.log 2>&1; then
            cat semantic-release-dry-run.log
            exit 1
          fi
          cat semantic-release-dry-run.log
          VERSION="$(sed -nE 's/.*The next release version is:?[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' semantic-release-dry-run.log | tail -n 1)"
          if [ -z "$VERSION" ] && ! grep -q "There are no relevant changes" semantic-release-dry-run.log; then
            echo "No se pudo resolver la versión prevista de semantic-release." >&2
            exit 1
          fi
        fi
        if [ -z "$VERSION" ]; then
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
        fi
        echo "Building version $VERSION"
        echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, release-version]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
            installer: false
          - os: windows-latest
            target: windows-x64
            ext: .exe
            installer: true
          - os: macos-latest
            target: darwin-x64
            ext: ""
            installer: false
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Use resolved version
      id: version
      shell: bash
      env:
        VERSION: ${{ needs.release-version.outputs.version }}
      run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install dependencies (CLI)
      run: |
        cd cli
        bun install

    - name: Install dependencies (Daemon)
      run: |
        cd daemon
        bun install

    - name: Install dependencies (Web)
      run: |
        cd web
        npm ci

    - name: Build CLI
      shell: bash
      env:
        LIBREDECK_VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd cli
        bun run build
        mv libredeck-cli${{ matrix.ext }} ../libredeck-cli-v${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}

    - name: "Setup Rust (all OS: launcher + updater ship everywhere)"
      uses: dtolnay/rust-toolchain@stable

    - name: Install Linux system deps (GPUI needs xkbcommon/wayland/GL/fonts)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libgl1-mesa-dev libfontconfig1-dev

    - name: Build launcher + updater (all OS)
      shell: bash
      env:
        LIBREDECK_VERSION: ${{ steps.version.outputs.version }}
        LIBREDECK_UPDATE_PUBKEY: ${{ secrets.LIBREDECK_UPDATE_PUBKEY }}
      run: |
        cd launcher
        cargo build --release

    - name: Build Web
      run: |
        cd web
        npm run build

    - name: Copy Web dist to Daemon
      run: node scripts/copy-web-dist.js

    - name: Build Unified Daemon
      shell: bash
      env:
        LIBREDECK_VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd daemon
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          bun run build:win
        else
          bun run build
        fi
        mv libredeck-daemon${{ matrix.ext }} ../libredeck-daemon-v${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}

    - name: Assemble managed bundle (daemon+cli+launcher+updater+web)
      shell: bash
      run: |
        rm -rf dist
        mkdir -p dist
        cp libredeck-daemon-v${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.ext }} "dist/libredeck-daemon${{ matrix.ext }}"
        cp libredeck-cli-v${{ steps.version.outputs.version }}-${{ matrix.target }}${{ matrix.ext }} "dist/libredeck-cli${{ matrix.ext }}"
        LAUNCHER_EXT="${{ matrix.ext }}"
        cp launcher/target/release/libredeck-launcher${LAUNCHER_EXT} "dist/libredeck-launcher${LAUNCHER_EXT}"
        cp launcher/target/release/libredeck-updater${LAUNCHER_EXT} "dist/libredeck-updater${LAUNCHER_EXT}"
        mkdir -p dist/web-dist
        cp -r web/dist/* dist/web-dist/
        echo "{\"version\":\"${{ steps.version.outputs.version }}\"}" > dist/active.json
        bash scripts/make-bundle.sh "${{ steps.version.outputs.version }}" "${{ matrix.target }}"

    - name: Package Web dist (non-Windows, legacy standalone layout)
      if: matrix.installer == false
      run: tar -czf libredeck-web-dist-v${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz -C web dist
      shell: bash

    - name: Setup Inno Setup (Windows only)
      if: matrix.installer == true
      shell: bash
      run: |
        choco install innosetup -y
        echo "C:\Program Files (x86)\Inno Setup 6" >> $GITHUB_PATH

    - name: Build Windows Installer
      if: matrix.installer == true
      run: |
        mkdir -p installer
        echo "#define AppVersion \"${{ steps.version.outputs.version }}\"" > version.iss
        iscc installer.iss
        mv installer/BunDeck-Setup.exe installer/BunDeck-Setup-v${{ steps.version.outputs.version }}.exe
      shell: bash

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libredeck-${{ matrix.os }}
        path: |
          libredeck-cli-v*-${{ matrix.target }}${{ matrix.ext }}
          libredeck-daemon-v*-${{ matrix.target }}${{ matrix.ext }}
          libredeck-web-dist-v*-${{ matrix.target }}.tar.gz
          bundeck-v*-${{ matrix.target }}.zip
          bundeck-v*-${{ matrix.target }}.zip.sha256
          installer/BunDeck-Setup-v*.exe

  release:
    needs: [build, release-version]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: bun install

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Move artifacts to root
      run: |
        find artifacts -name "libredeck-cli-v*-*" -exec mv {} . \;
        find artifacts -name "libredeck-daemon-v*-*" -exec mv {} . \;
        find artifacts -name "libredeck-web-dist-v*.tar.gz" -exec mv {} . \; || true
        find artifacts -name "bundeck-v*.zip" -exec mv {} . \; || true
        find artifacts -name "bundeck-v*.zip.sha256" -exec mv {} . \; || true
        find artifacts -name "BunDeck-Setup-v*.exe" -exec mv {} . \; || true

    - name: Build update manifest (signed if secret present)
      env:
        LIBREDECK_UPDATE_PRIVKEY: ${{ secrets.LIBREDECK_UPDATE_PRIVKEY }}
        VERSION: ${{ needs.release-version.outputs.version }}
      run: |
        VER="$VERSION"
        for target in windows-x64 linux-x64 darwin-x64; do
          test -f "bundeck-v${VER}-${target}.zip" || {
            echo "Falta el bundle esperado para ${VER}: ${target}" >&2
            exit 1
          }
        done
        echo "Manifest version: $VER"
        node scripts/build-update-manifest.mjs --version "$VER" --assets . --out bundeck-update-manifest.json
        cat bundeck-update-manifest.json
        node --input-type=module <<'NODE'
        import { readFileSync } from 'node:fs';
        const manifest = JSON.parse(readFileSync('bundeck-update-manifest.json', 'utf8'));
        const expected = process.env.VERSION;
        if (manifest.version !== expected) {
          throw new Error(`Manifiesto v${manifest.version}; se esperaba v${expected}`);
        }
        for (const [target, asset] of Object.entries(manifest.assets)) {
          const expectedBundle = `bundeck-v${expected}-${target}.zip`;
          if (asset.bundle !== expectedBundle) {
            throw new Error(`${target}: bundle ${asset.bundle}; se esperaba ${expectedBundle}`);
          }
        }
        NODE

    - name: Create stable latest aliases (unversioned, for direct /latest/download links)
      run: |
        shopt -s nullglob
        for f in libredeck-cli-v*-windows-x64.exe; do cp "$f" libredeck-cli-windows-x64.exe; done
        for f in libredeck-cli-v*-linux-x64; do cp "$f" libredeck-cli-linux-x64; done
        for f in libredeck-cli-v*-darwin-x64; do cp "$f" libredeck-cli-darwin-x64; done
        for f in libredeck-daemon-v*-windows-x64.exe; do cp "$f" libredeck-daemon-windows-x64.exe; done
        for f in libredeck-daemon-v*-linux-x64; do cp "$f" libredeck-daemon-linux-x64; done
        for f in libredeck-daemon-v*-darwin-x64; do cp "$f" libredeck-daemon-darwin-x64; done
        for f in libredeck-web-dist-v*-linux-x64.tar.gz; do cp "$f" libredeck-web-dist-linux-x64.tar.gz; done
        for f in libredeck-web-dist-v*-darwin-x64.tar.gz; do cp "$f" libredeck-web-dist-darwin-x64.tar.gz; done
        for f in BunDeck-Setup-v*.exe; do cp "$f" BunDeck-Setup.exe; done
        ls -la libredeck-* BunDeck-*.exe 2>/dev/null || true

    - name: Release
      run: bunx semantic-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
