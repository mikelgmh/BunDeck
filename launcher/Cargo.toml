[package]
name = "libredeck-launcher"
version = "1.5.0"
edition = "2021"
description = "LibreDeck launcher/status window (Rust + GPUI)"
license = "MIT"

[[bin]]
name = "libredeck-launcher"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

# Tray icon nativo en Windows (Shell_NotifyIconW). El `windows` ya es
# dependencia transitiva de gpui 0.2 (misma versión: sin duplicados).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
