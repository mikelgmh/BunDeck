[package]
name = "libredeck-launcher"
version = "1.5.0"
edition = "2021"
description = "LibreDeck launcher/status window (Rust + GPUI)"
license = "MIT"

[[bin]]
name = "libredeck-launcher"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

[profile.release]
opt-level = "z"
lto = true
strip = true
